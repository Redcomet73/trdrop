name: Windows x64 frozen reference

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_REQUIRE_VIRTUALENV: '1'
      PIP_INDEX_URL: https://pypi.org/simple

    steps:
      - name: Configure temporary directories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:RUNNER_TEMP) { throw 'RUNNER_TEMP is required' }
          "PIP_CACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'pip-cache')" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Checkout build infrastructure and frozen Git objects
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        env:
          PIP_REQUIRE_VIRTUALENV: '0'
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false
          token: ''

      - name: Verify selected Python and prepare locked helper environment
        shell: pwsh
        env:
          SELECTED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if (!$env:SELECTED_PYTHON) {
              throw 'setup-python did not return an executable'
          }
          $selected = (Resolve-Path -LiteralPath $env:SELECTED_PYTHON).Path
          $probe = 'import json,platform,struct,sys; print(json.dumps({"version":platform.python_version(),"bits":struct.calcsize("P")*8,"machine":platform.machine(),"executable":sys.executable,"implementation":platform.python_implementation()}))'
          $raw = & $selected -I -c $probe
          if ($LASTEXITCODE -ne 0) { throw 'Selected Python probe failed' }
          $info = $raw | ConvertFrom-Json
          if ($info.version -ne '3.13.15' -or
              $info.bits -ne 64 -or
              $info.machine -notin @('AMD64', 'x86_64') -or
              $info.implementation -ne 'CPython' -or
              (Resolve-Path -LiteralPath $info.executable).Path -ne $selected) {
              throw 'Selected Python identity mismatch'
          }

          $provenance = Join-Path $env:RUNNER_TEMP 'selected-python.json'
          @{
              version = $info.version
              bits = $info.bits
              machine = $info.machine
              implementation = $info.implementation
              executable = $selected
              sha256 = (Get-FileHash -LiteralPath $selected -Algorithm SHA256).Hash.ToLowerInvariant()
              provider_commit = '5fda3b95a4ea91299a34e894583c3862153e4b97'
          } | ConvertTo-Json | Set-Content $provenance -Encoding utf8

          $venv = Join-Path $env:RUNNER_TEMP 'trdrop-python'
          if (Test-Path -LiteralPath $venv) {
              throw "Refusing to reuse helper environment: $venv"
          }
          & $selected -I -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Virtual environment creation failed' }

          $helper = Join-Path $venv 'Scripts/python.exe'
          $lock = Join-Path $env:GITHUB_WORKSPACE 'baseline/python-win64.lock'
          $constraints = Join-Path $env:RUNNER_TEMP 'python-constraints.txt'
          $report = Join-Path $env:RUNNER_TEMP 'python-install-report.json'

          # Derive exact constraints from the single reviewed lock file.
          $pins = foreach ($line in Get-Content -LiteralPath $lock) {
              if (!$line.Trim() -or $line.TrimStart().StartsWith('#')) { continue }
              if ($line -notmatch '^([A-Za-z0-9_.-]+==[A-Za-z0-9_.+!-]+) --hash=sha256:[0-9a-f]{64}$') {
                  throw "Invalid lock entry: $line"
              }
              $Matches[1]
          }
          $pins | Set-Content $constraints -Encoding ascii

          # All third-party packages, including pip itself, are exact and hashed.
          # Wheels only: no source builds or build-time dependency resolution.
          & $helper -m pip install --require-hashes --only-binary=:all: --no-cache-dir --force-reinstall --report $report -r $lock
          if ($LASTEXITCODE -ne 0) { throw 'Locked helper installation failed' }
          & $helper -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Helper dependency check failed' }

          "$venv/Scripts" >> $env:GITHUB_PATH
          "VIRTUAL_ENV=$venv" >> $env:GITHUB_ENV
          "BASELINE_PYTHON=$helper" >> $env:GITHUB_ENV
          "BASELINE_BASE_PYTHON=$selected" >> $env:GITHUB_ENV
          "BASELINE_PYTHON_PROVENANCE=$provenance" >> $env:GITHUB_ENV
          "BASELINE_PYTHON_INSTALL_REPORT=$report" >> $env:GITHUB_ENV
          "PIP_CONSTRAINT=$constraints" >> $env:GITHUB_ENV
          "PIP_NO_INDEX=1" >> $env:GITHUB_ENV

      - name: Verify Python PATH before Qt action
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          function Normalize-ExistingPath([string] $Path) {
              if ([string]::IsNullOrWhiteSpace($Path)) {
                  throw 'Required interpreter path is empty'
              }
              $resolved = Resolve-Path -LiteralPath $Path -ErrorAction Stop
              if ($resolved.Provider.Name -ne 'FileSystem') {
                  throw 'Interpreter path is not a filesystem path'
              }
              return [IO.Path]::GetFullPath($resolved.ProviderPath).Replace('/', '\')
          }

          function Assert-SamePath(
              [string] $Actual, [string] $Expected, [string] $Label
          ) {
              $a = Normalize-ExistingPath $Actual
              $e = Normalize-ExistingPath $Expected
              if (-not [StringComparer]::OrdinalIgnoreCase.Equals($a, $e)) {
                  throw "${Label}: actual='$a'; expected='$e'"
              }
          }

          $candidates = @(Get-Command python -CommandType Application -All -ErrorAction Stop)
          if ($candidates.Count -eq 0) {
              throw 'No Python application was found on PATH'
          }
          foreach ($candidate in $candidates) {
              Write-Host "Python PATH candidate: $($candidate.Source)"
          }
          $selected = $candidates[0]

          $command = Get-Command python -ErrorAction Stop
          if ($command.CommandType -ne 'Application') {
              throw 'Python resolves to a non-application command'
          }
          Assert-SamePath $selected.Source $command.Source 'Application and effective command resolution mismatch'

          $venv = Join-Path $env:RUNNER_TEMP 'trdrop-python'
          $expected = Join-Path $venv 'Scripts\python.exe'
          Write-Host "PATH-selected Python: $($selected.Source)"
          Write-Host "Effective Python command: $($command.Source)"
          Write-Host "Expected locked Python: $expected"

          Assert-SamePath $env:VIRTUAL_ENV $venv 'Virtualenv directory mismatch'
          Assert-SamePath $env:BASELINE_PYTHON $expected 'Locked executable mismatch'
          Assert-SamePath $selected.Source $expected 'PATH interpreter mismatch'

          $probe = 'import json,platform,struct,sys; print(json.dumps({"version":platform.python_version(),"bits":struct.calcsize("P")*8,"machine":platform.machine(),"implementation":platform.python_implementation(),"executable":sys.executable,"prefix":sys.prefix,"base_prefix":sys.base_prefix,"base_executable":sys._base_executable}))'
          $raw = python -I -c $probe
          if ($LASTEXITCODE -ne 0) {
              throw 'PATH-selected Python identity probe failed'
          }
          $info = $raw | ConvertFrom-Json
          Write-Host ($info | ConvertTo-Json -Compress)

          if ($info.version -ne '3.13.15' -or
              $info.bits -ne 64 -or
              $info.machine -notin @('AMD64', 'x86_64') -or
              $info.implementation -ne 'CPython') {
              throw 'PATH-selected interpreter is not CPython 3.13.15 x64'
          }

          Assert-SamePath $info.executable $expected 'Runtime executable mismatch'
          Assert-SamePath $info.prefix $venv 'Runtime virtualenv mismatch'
          Assert-SamePath $info.base_executable $env:BASELINE_BASE_PYTHON 'Base interpreter mismatch'

          if ([StringComparer]::OrdinalIgnoreCase.Equals(
              (Normalize-ExistingPath $info.prefix),
              (Normalize-ExistingPath $info.base_prefix))) {
              throw 'PATH-selected interpreter is not running inside a virtualenv'
          }

          python -m pip --version
          if ($LASTEXITCODE -ne 0) {
              throw 'Virtualenv pip invocation failed'
          }

      # Use the pinned executable sub-action: the root composite uses
      # floating child-action references.
      - name: Install historical Qt and matching compiler
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_mingw81
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          dir: ${{ runner.temp }}
          install-deps: false
          cache: false
          use-official: false
          aqtversion: '==3.3.0'
          py7zrversion: '==1.1.3'
          add-tools-to-path: true
          set-env: true

      - name: Build, capture and compare original reference
        shell: pwsh
        run: ./baseline/windows.ps1

      - name: Preserve build outputs and diagnostic evidence
        if: always()
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trdrop-reference-win64-a0b4563-${{ github.run_id }}-${{ github.run_attempt }}
          path: reference-artifact/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
          include-hidden-files: false

      - name: Artifact location
        if: always()
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "Reference artifact (may contain partial failure evidence): $env:ARTIFACT_URL" >> $env:GITHUB_STEP_SUMMARY
